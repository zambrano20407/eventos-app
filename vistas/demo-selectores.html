<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muestra · Selectores de fecha y horario</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <style>
      body { background: #eef1f6; }
      .demo-wrap { max-width: 760px; margin: 24px auto; padding: 0 16px; }
      .demo-card { background: #fff; border-radius: 10px; padding: 24px 26px; }
      .demo-aviso {
        font-size: 12.5px; color: #92400e; background: #fffbeb;
        border: 1.5px solid #fcd34d; border-radius: 6px;
        padding: 10px 14px; margin-bottom: 16px;
      }
      .demo-valor {
        font-family: "Courier New", monospace; font-size: 12.5px;
        background: #f4f6f9; border-radius: 6px; padding: 10px 12px;
        margin-top: 10px; color: #1a1a2e;
      }
      .form-grid { margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div class="demo-wrap">
      <p class="demo-aviso">
        <strong>Página de muestra</strong> de los selectores, sin Firebase.
        Abajo se ve el valor que queda guardado.
      </p>

      <div class="demo-card">
        <div class="section-title">Fecha del evento</div>
        <div class="field" style="margin-bottom: 22px">
          <label>Fecha</label>
          <input type="date" id="evFecha" min="" />
          <div class="demo-valor">valor guardado: <b id="valFecha">—</b></div>
        </div>

        <div class="section-title">Horario (SGFT07)</div>
        <div class="field">
          <label>Horario</label>
          <input type="text" id="evHorario" />
          <div class="demo-valor">valor guardado: <b id="valHorario">—</b></div>
        </div>
      </div>
    </div>

    <script type="module">
      import { montarSelectorFecha, montarSelectorHorario } from "../js/selectores.js";

      const hoy = new Date();
      document.getElementById("evFecha").value = [
        hoy.getFullYear(),
        String(hoy.getMonth() + 1).padStart(2, "0"),
        String(hoy.getDate()).padStart(2, "0"),
      ].join("-");

      window._selFecha = montarSelectorFecha("evFecha");
      window._selHorario = montarSelectorHorario("evHorario");

      // Mostrar en vivo lo que queda guardado
      setInterval(() => {
        document.getElementById("valFecha").textContent =
          document.getElementById("evFecha").value || "(vacío)";
        document.getElementById("valHorario").textContent =
          document.getElementById("evHorario").value || "(vacío)";
      }, 200);
    </script>
  </body>
</html>
